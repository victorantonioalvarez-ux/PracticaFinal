<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="./css/styles.css">
	<title></title>
</head>
<body>
	<aside class="barra-lateral">
		<h3 class="titulo-menu">Menú</h3>
		<nav class="menu">
			<a href="./index.html">Lista de actividades</a>
			<a href="./creaciontareanueva.html">Crear tarea</a>
			<a href="./gestioncategoria.html">Gestion de categorias</a>
		</nav>
	</aside>

	<main class="contenido">
		<h1 class="titulo-principal">Crear nueva tarea</h1>

		<form class="formulario" id="form-tareas">
			<label for="titulo-tarea">Título</label>
			<input id="titulo-tarea" name="titulo-tarea" required>
			<label for="descripcion">Descripción</label>
			<textarea id="descripcion" name="descripcion" rows="4" placeholder="Escribe aquí..." required></textarea>
			<label for="fecha">Fecha</label>
			<input id="fecha" type="date">
			
			<label for="categoria">Categoría</label>
			<select id="categoria">
				<option value="">Selecciona</option>
			</select>

			<label for="prioridad">Prioridad</label>
			<select id="prioridad">
				<option>Baja</option>
				<option>Media</option>
				<option>Alta</option>
			</select>

			<button type="submit">Crear tarea</button>
		</form>
	</main>

	<script src="./js/storage.js"></script>
	<script src="./js/modelos.js"></script>
	<script src="./js/form-tarea.js"></script>
</body>
</html>
